architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "figura-unchained"
}
version = "${project.mod_version}+mc${project.fabric_minecraft_label}+fabric+nofigura${project.nofigura_version}"

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    common(project(path: ":common")) { transitive false }

    compileOnly files("../libs/nofigura-${project.nofigura_version}+${project.minecraft_version}-fabric-mc.jar")
}

processResources {
    from project(":common").sourceSets.main.resources

    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    filesMatching("figura_unchained_build.properties") {
        expand "version": project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
