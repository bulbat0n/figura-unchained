name: release

on:
  workflow_dispatch:
    inputs:
      Version:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.Version }}
      BRANCHES: 1.20.1 1.21.1 1.21.4 1.21.10 1.21.11 26.1.2 26.2 26.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Collect the CI builds and create the draft release
        run: bash .github/scripts/release-draft.sh
